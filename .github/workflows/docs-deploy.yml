name: Docs

# Build the Docusaurus site under apps/docs/ and deploy it to
# https://docs.torcato.dev/homelab-nut/ (Cloudflare Workers static assets).
# The old GitHub Pages site only redirects there. PRs build but don't deploy. Path filter keeps unrelated commits from
# wasting runner minutes.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs-deploy.yml'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/docs/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/docs
        run: pnpm typecheck

      - name: Build
        working-directory: apps/docs
        run: pnpm build

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/docs/build
          retention-days: 7

  e2e:
    name: playwright smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/docs/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/docs
        run: pnpm test:e2e:install

      - name: Run smoke test
        working-directory: apps/docs
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

  # Inlines rtorcato/repo-tooling's docs-deploy-cloudflare.yml (v6.0.0) rather than
  # calling it: that reusable workflow installs and builds from a root pnpm
  # workspace, and this Go repo keeps its only package.json in apps/docs.
  # Deploys the artifact the build job made, so there is no second build.
  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Workers static assets serve files by exact URL path, and Docusaurus writes
      # build/ flat even with a non-root baseUrl, so nest it under the base path.
      # A `host/path/*` route doesn't match the bare `host/path` (it 522s), so
      # route both; assets' auto-trailing-slash redirects the bare one.
      - name: Stage assets and generate wrangler config
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site/homelab-nut"
          cp -R site/. "$RUNNER_TEMP/site/homelab-nut/"
          jq -n --arg dir "$RUNNER_TEMP/site" \
            '{name: "homelab-nut-docs", compatibility_date: (now | strftime("%Y-%m-%d")),
              assets: {directory: $dir, not_found_handling: "404-page"},
              routes: ["docs.torcato.dev/homelab-nut/*", "docs.torcato.dev/homelab-nut"]}' \
            > "$RUNNER_TEMP/wrangler.jsonc"
          cat "$RUNNER_TEMP/wrangler.jsonc"

      # Exact pin, matching repo-tooling: this step holds the Cloudflare token, so a
      # floating range would run whatever wrangler publishes next.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config "$RUNNER_TEMP/wrangler.jsonc"

  # Old site: rtorcato.github.io/homelab-nut/ now only redirects to the new address.
  # GitHub Pages can't redirect server-side, so every path gets a meta-refresh stub
  # (index.html, plus 404.html so deep links land on the matching page).
  # Delete this job once Pages is disabled in the repo settings.
  pages-redirect:
    name: redirect gh-pages
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write   # peaceiris/actions-gh-pages writes to the gh-pages branch
    steps:
      - name: Write redirect stub
        run: |
          mkdir -p stub
          cat > stub/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>homelab-nut docs have moved</title>
          <link rel="canonical" href="https://docs.torcato.dev/homelab-nut/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://docs.torcato.dev/homelab-nut/">
          <script>
          location.replace('https://docs.torcato.dev' + location.pathname + location.search + location.hash)
          </script>
          </head>
          <body>
          <p>The homelab-nut docs have moved to <a href="https://docs.torcato.dev/homelab-nut/">docs.torcato.dev/homelab-nut</a>.</p>
          </body>
          </html>
          EOF
          cp stub/index.html stub/404.html

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stub
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: redirect gh-pages to docs.torcato.dev from ${{ github.sha }}"
